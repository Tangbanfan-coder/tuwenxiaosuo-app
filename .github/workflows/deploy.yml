name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # peaceiris 需要用 GITHUB_TOKEN 推到 gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 关键：web 构建带 --base /xuying-app/，不改变 vite.config.ts（Android 不受影响）
      - run: npm run build -- --base /xuying-app/

      # SPA 深链回退（可选但推荐）：把 index.html 复制成 404.html
      - run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # enable_jekyll 默认 false → 自动加 .nojekyll，避免 Pages 跑 Jekyll 把 _ 开头文件吞掉
